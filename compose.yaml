services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATA_DIR: /app/data
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PRACTICE_TOOLS: ${PRACTICE_TOOLS:-false}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65
    volumes:
      - health-data:/app/data
    restart: unless-stopped
volumes:
  health-data:
