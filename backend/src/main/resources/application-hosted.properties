# One application instance, persistent disk required. Do not put DATA_DIR on ephemeral storage.
spring.datasource.url=jdbc:h2:file:${DATA_DIR:/app/data}/smarthealth;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=${DATABASE_PASSWORD}
server.servlet.session.cookie.secure=true
spring.h2.console.enabled=false
