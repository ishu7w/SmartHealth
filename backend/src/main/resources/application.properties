server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:${DATA_DIR:./data}/smarthealth;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=30m
server.error.include-message=never
smarthealth.admin.email=${ADMIN_EMAIL:}
smarthealth.admin.password=${ADMIN_PASSWORD:}
server.forward-headers-strategy=framework
server.shutdown=graceful
smarthealth.practice-tools=${PRACTICE_TOOLS:false}
