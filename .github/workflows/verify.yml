name: Verify SmartHealth
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: smarthealth_test
          MYSQL_ROOT_PASSWORD: ci-test-password
          MYSQL_USER: smarthealth_test
          MYSQL_PASSWORD: ci-test-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test on MySQL
        run: mvn -B -f backend/pom.xml test
        env:
          TEST_DATABASE_URL: jdbc:mysql://localhost:3306/smarthealth_test
          TEST_DATABASE_USER: smarthealth_test
          TEST_DATABASE_PASSWORD: ci-test-password
      - name: Build combined app
        run: sh scripts/build.sh
      - name: Start test application
        run: |
          java -jar backend/target/smarthealth-2.0.0.jar --spring.profiles.active=demo > /tmp/smarthealth.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://localhost:8080/api/health && exit 0; sleep 1; done
          cat /tmp/smarthealth.log
          exit 1
        env:
          ADMIN_EMAIL: admin@example.test
          ADMIN_PASSWORD: local-test-password-123
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser verification
        working-directory: frontend
        run: npm run test:e2e
        env:
          APP_URL: http://localhost:8080
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: frontend/test-results
