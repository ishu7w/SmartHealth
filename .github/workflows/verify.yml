name: Verify SmartHealth
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATA_DIR: /tmp/smarthealth-ci-data
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: local-test-password-123
      APP_URL: http://localhost:8080
      PRACTICE_TOOLS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and test combined app
        run: sh scripts/build.sh
      - name: Verify CSV export
        run: npm run test:unit --prefix frontend
      - name: Start test application
        run: |
          java -jar backend/target/smarthealth-2.0.0.jar > /tmp/smarthealth.log 2>&1 &
          echo $! > /tmp/smarthealth.pid
          for i in $(seq 1 40); do curl -fsS http://localhost:8080/api/health && exit 0; sleep 1; done
          cat /tmp/smarthealth.log
          exit 1
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser verification
        working-directory: frontend
        run: npm run test:e2e
      - name: Verify data survives application restart
        run: |
          node frontend/tests/persistence-check.mjs save
          kill "$(cat /tmp/smarthealth.pid)"
          for i in $(seq 1 30); do kill -0 "$(cat /tmp/smarthealth.pid)" 2>/dev/null || break; sleep 1; done
          java -jar backend/target/smarthealth-2.0.0.jar >> /tmp/smarthealth.log 2>&1 &
          echo $! > /tmp/smarthealth.pid
          ready=false
          for i in $(seq 1 40); do if curl -fsS http://localhost:8080/api/health; then ready=true; break; fi; sleep 1; done
          test "$ready" = true
          node frontend/tests/persistence-check.mjs verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-failure
          path: |
            frontend/test-results
            backend/target/surefire-reports
            /tmp/smarthealth.log
